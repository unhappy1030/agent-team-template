# name:cli:model
# cli는 claude / antigravity / codex
# name은 tmux 세션 이름으로도 쓰이므로 공백/콜론 없이 하이픈 권장
# "main"으로 시작하는 에이전트(main-gpt, main-claude)만 수동 승인으로 뜬다 (나머지는 자동 승인)
#
# codex는 model 칸을 "<모델>-<추론강도>"로 적는다 (강도: minimal/low/medium/high/xhigh/max/
# ultra/persistent). start.sh가 뒤쪽 강도를 떼어 -c model_reasoning_effort= 로 넘긴다.
#
# main-gpt가 평소 main이고, main-claude는 평소엔 자문(supervisor)을 하다가 main-gpt의 토큰이
# 떨어지면 사람이 "인계받아"라고 해서 main으로 넘어온다 (roles/main-claude.md 참고).

main-gpt:codex:gpt-5.6-sol-high
main-claude:claude:opus
code1:codex:gpt-5.6-luna-xhigh
code2:claude:sonnet
reviewer1:antigravity:gemini-3.8-flash-high
reviewer2:antigravity:gemini-3.8-flash-high
