# name:cli:model
# cli는 claude / antigravity / codex
# name은 tmux 세션 이름으로도 쓰이므로 공백/콜론 없이 하이픈 권장
# "main"으로 시작하는 에이전트(main-gpt, main-claude)만 수동 승인으로 뜬다
#
# 자료조사·문서 작업용 2인 팀. main-gpt, main-claude는 동등한 공동 main이라 사람이 언제든 둘 중
# 아무 세션에나 입력한다. 워커 없이 각자 직접 조사하고 쓴다 (roles/main-*.md 참고).
#
# model에 <계열>-latest(codex, 예: sol-latest-high) / latest-<강도>(agy)를 쓰면 start 때마다 최신 모델로 풀린다.
# claude는 opus/sonnet 별칭이 원래 최신을 가리킨다. codex 구체 슬러그도 은퇴 예정이면 후속 모델로 자동 전환.

main-gpt:codex:sol-latest-high
main-claude:claude:opus
